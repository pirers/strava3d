<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>strava3d – GPX → SVG</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #f8fafc;
    }
    header h1 span { color: #f97316; }
    header p {
      margin-top: .5rem;
      color: #94a3b8;
      font-size: .95rem;
    }

    /* ── Card ─────────────────────────────────────────────────────────────── */
    .card {
      background: #1e2330;
      border: 1px solid #2d3748;
      border-radius: 1rem;
      padding: 2rem;
      width: 100%;
      max-width: 540px;
    }

    /* ── Drop zone ────────────────────────────────────────────────────────── */
    .drop-zone {
      border: 2px dashed #4a5568;
      border-radius: .75rem;
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      margin-bottom: 1.75rem;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #f97316;
      background: rgba(249,115,22,.06);
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .drop-zone .icon { font-size: 2.5rem; line-height: 1; }
    .drop-zone .label {
      margin-top: .75rem;
      font-size: .9rem;
      color: #94a3b8;
    }
    .drop-zone .filename {
      margin-top: .5rem;
      font-size: .85rem;
      color: #f97316;
      font-weight: 600;
      min-height: 1.2em;
    }

    /* ── Form grid ────────────────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }
    .field { display: flex; flex-direction: column; gap: .35rem; }
    .field.full { grid-column: 1 / -1; }
    label {
      font-size: .8rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    input[type="text"],
    input[type="number"],
    select {
      background: #111827;
      border: 1px solid #374151;
      border-radius: .5rem;
      color: #e2e8f0;
      padding: .55rem .75rem;
      font-size: .9rem;
      width: 100%;
      transition: border-color .2s;
    }
    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      outline: none;
      border-color: #f97316;
    }
    select option { background: #111827; }

    /* ── Toggle row ───────────────────────────────────────────────────────── */
    .toggles {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.75rem;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: .5rem;
      cursor: pointer;
      font-size: .9rem;
      color: #cbd5e1;
      user-select: none;
    }
    /* Custom checkbox */
    .toggle-label input[type="checkbox"] { display: none; }
    .toggle-label .box {
      width: 1.1rem;
      height: 1.1rem;
      border: 2px solid #4a5568;
      border-radius: .25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color .2s, background .2s;
    }
    .toggle-label input[type="checkbox"]:checked + .box {
      background: #f97316;
      border-color: #f97316;
    }
    .toggle-label .box::after {
      content: "";
      display: block;
      width: .35rem;
      height: .6rem;
      border: 2px solid white;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translate(-1px, -1px);
      opacity: 0;
    }
    .toggle-label input[type="checkbox"]:checked + .box::after { opacity: 1; }

    /* ── Submit button ────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      background: #f97316;
      color: white;
      font-size: .95rem;
      font-weight: 700;
      border: none;
      border-radius: .65rem;
      padding: .75rem 1.75rem;
      cursor: pointer;
      width: 100%;
      transition: background .2s, transform .1s;
    }
    .btn:hover:not(:disabled) { background: #ea6a0a; }
    .btn:active:not(:disabled) { transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn .spinner {
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    .btn.loading .spinner { display: block; }
    .btn.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error banner ─────────────────────────────────────────────────────── */
    .error-box {
      display: none;
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.4);
      color: #fca5a5;
      border-radius: .65rem;
      padding: .85rem 1rem;
      font-size: .875rem;
      margin-top: 1rem;
    }
    .error-box.visible { display: block; }

    /* ── Result section ───────────────────────────────────────────────────── */
    .result-section {
      display: none;
      width: 100%;
      max-width: 540px;
      margin-top: 2rem;
    }
    .result-section.visible { display: block; }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .result-header h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: #16a34a;
      color: white;
      font-size: .85rem;
      font-weight: 700;
      border: none;
      border-radius: .55rem;
      padding: .5rem 1.1rem;
      cursor: pointer;
      text-decoration: none;
      transition: background .2s;
    }
    .btn-download:hover { background: #15803d; }

    .preview-box {
      background: #fff;
      border-radius: .75rem;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 260px;
      overflow: hidden;
    }
    .preview-box svg {
      max-width: 100%;
      max-height: 460px;
      height: auto;
      width: auto;
    }

    /* ── Responsive ───────────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
      .field.full { grid-column: 1; }
    }
  </style>
</head>
<body>

  <header>
    <h1>strava<span>3d</span></h1>
    <p>Upload a GPX track → get a plotter-ready SVG</p>
  </header>

  <div class="card">
    <form id="renderForm" novalidate>

      <!-- Drop zone / file picker -->
      <div class="drop-zone" id="dropZone">
        <input type="file" id="gpxFile" name="gpx" accept=".gpx,application/gpx+xml,text/xml" required />
        <div class="icon">🗺️</div>
        <div class="label">Drop a <strong>.gpx</strong> file here, or click to browse</div>
        <div class="filename" id="fileLabel"></div>
      </div>

      <!-- Size / unit / style options -->
      <div class="grid">
        <div class="field">
          <label for="width">Width</label>
          <input type="number" id="width" name="width" value="300" min="1" step="any" />
        </div>
        <div class="field">
          <label for="height">Height</label>
          <input type="number" id="height" name="height" value="300" min="1" step="any" />
        </div>
        <div class="field">
          <label for="unit">Unit</label>
          <select id="unit" name="unit">
            <option value="mm" selected>mm</option>
            <option value="px">px</option>
          </select>
        </div>
        <div class="field">
          <label for="padding">Padding</label>
          <input type="number" id="padding" name="padding" value="10" min="0" step="any" />
        </div>
        <div class="field">
          <label for="stroke_width">Stroke width</label>
          <input type="number" id="stroke_width" name="stroke_width" value="2" min="0.1" step="any" />
        </div>
        <div class="field">
          <label for="name">Track name <span style="font-weight:400;text-transform:none">(optional)</span></label>
          <input type="text" id="name" name="name" placeholder="auto from GPX" />
        </div>
      </div>

      <!-- Toggles -->
      <div class="toggles">
        <label class="toggle-label">
          <input type="checkbox" id="frame" name="frame" />
          <span class="box"></span>
          Draw frame
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="stats" name="stats" />
          <span class="box"></span>
          Show stats (distance &amp; elevation)
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="elevation_profile" name="elevation_profile" />
          <span class="box"></span>
          Elevation profile
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="view_3d" name="view_3d" />
          <span class="box"></span>
          3D view
        </label>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        <span class="spinner"></span>
        <span class="btn-text">🎨 Generate SVG</span>
      </button>

      <div class="error-box" id="errorBox"></div>

    </form>
  </div>

  <!-- Result -->
  <div class="result-section" id="resultSection">
    <div class="result-header">
      <h2>Preview</h2>
      <a id="downloadLink" class="btn-download" download="track.svg" href="#">
        ⬇ Download SVG
      </a>
    </div>
    <div class="preview-box" id="previewBox"></div>
  </div>

  <script>
    const form        = document.getElementById('renderForm');
    const fileInput   = document.getElementById('gpxFile');
    const fileLabel   = document.getElementById('fileLabel');
    const dropZone    = document.getElementById('dropZone');
    const submitBtn   = document.getElementById('submitBtn');
    const errorBox    = document.getElementById('errorBox');
    const resultSec   = document.getElementById('resultSection');
    const previewBox  = document.getElementById('previewBox');
    const downloadLnk = document.getElementById('downloadLink');

    /* ── Drag & drop highlight ─────────────────────────────────────────── */
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        updateFileLabel();
      }
    });

    fileInput.addEventListener('change', updateFileLabel);

    function updateFileLabel() {
      fileLabel.textContent = fileInput.files[0] ? fileInput.files[0].name : '';
    }

    /* ── Form submit ───────────────────────────────────────────────────── */
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      if (!fileInput.files[0]) {
        showError('Please select a GPX file first.');
        return;
      }

      // Build query string from numeric/text/select fields
      const params = new URLSearchParams();
      ['width', 'height', 'unit', 'padding', 'stroke_width'].forEach(id => {
        const v = document.getElementById(id).value.trim();
        if (v) params.set(id, v);
      });

      const nameVal = document.getElementById('name').value.trim();
      if (nameVal) params.set('name', nameVal);

      params.set('frame', document.getElementById('frame').checked ? 'true' : 'false');
      params.set('stats', document.getElementById('stats').checked ? 'true' : 'false');
      params.set('elevation_profile', document.getElementById('elevation_profile').checked ? 'true' : 'false');
      params.set('view_3d', document.getElementById('view_3d').checked ? 'true' : 'false');

      const url = '/render?' + params.toString();

      // Build multipart form data
      const fd = new FormData();
      fd.append('gpx', fileInput.files[0]);

      setLoading(true);

      try {
        const resp = await fetch(url, { method: 'POST', body: fd });

        if (!resp.ok) {
          let msg = `Server error ${resp.status}`;
          try {
            const j = await resp.json();
            msg = j.detail || msg;
          } catch (_) { /* ignore */ }
          showError(msg);
          return;
        }

        const svgText = await resp.text();
        showResult(svgText);

      } catch (err) {
        showError('Network error: ' + err.message);
      } finally {
        setLoading(false);
      }
    });

    /* ── Helpers ───────────────────────────────────────────────────────── */
    function setLoading(on) {
      submitBtn.disabled = on;
      submitBtn.classList.toggle('loading', on);
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('visible');
    }

    function hideError() {
      errorBox.classList.remove('visible');
    }

    function showResult(svgText) {
      // Inline SVG preview
      previewBox.innerHTML = svgText;

      // Browsers do not execute <script> elements injected via innerHTML.
      // Re-create them as live elements so the interactive JS runs.
      previewBox.querySelectorAll('script').forEach(old => {
        // Strip XML CDATA wrappers that are used for SVG/XML validity.
        let code = (old.textContent || '').replace(/^\s*<!\[CDATA\[\s*/, '').replace(/\s*\]\]>\s*$/, '');
        if (!code.trim()) return;
        const s = document.createElement('script');
        s.textContent = code;
        // Append to document.body to trigger synchronous execution, then remove.
        document.body.appendChild(s);
        document.body.removeChild(s);
      });

      // Download link via Blob URL
      const blob = new Blob([svgText], { type: 'image/svg+xml' });
      const old  = downloadLnk.href;
      if (old.startsWith('blob:')) URL.revokeObjectURL(old);
      downloadLnk.href = URL.createObjectURL(blob);

      // Use file name (without extension) as download name
      const base = fileInput.files[0]?.name.replace(/\.gpx$/i, '') || 'track';
      downloadLnk.download = base + '.svg';

      resultSec.classList.add('visible');
      resultSec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  </script>

</body>
</html>
